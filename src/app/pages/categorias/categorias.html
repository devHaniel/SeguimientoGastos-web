<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-800">Categorías</h1>
    <button
      (click)="abrirNueva()"
      class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 transition"
    >
      + Nueva categoría
    </button>
  </div>

  <div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-gray-50 text-gray-600 text-sm">
        <tr>
          <th class="px-6 py-3 font-medium">Nombre</th>
          <th class="px-6 py-3 font-medium">Tipo</th>
          <th class="px-6 py-3 font-medium text-right">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        @for (cat of categorias(); track cat.id) {
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 text-gray-800">{{ cat.nombre }}</td>
            <td class="px-6 py-4">
              <span
                class="inline-block px-3 py-1 rounded-full text-xs font-semibold"
                [class.bg-green-100]="cat.tipo === 'INGRESO'"
                [class.text-green-700]="cat.tipo === 'INGRESO'"
                [class.bg-red-100]="cat.tipo === 'GASTO'"
                [class.text-red-700]="cat.tipo === 'GASTO'"
              >
                {{ cat.tipo }}
              </span>
            </td>
            <td class="px-6 py-4 text-right space-x-2">
              <button
                (click)="abrirEditar(cat)"
                class="text-gray-400 hover:text-teal-600 transition"
                title="Editar"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              </button>
              <button
                (click)="eliminar(cat)"
                class="text-gray-400 hover:text-red-600 transition"
                title="Eliminar"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              </button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="px-6 py-12 text-center text-gray-400">
              No hay categorías registradas.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (showModal()) {
  <div
    class="fixed inset-0 bg-black/40 flex items-center justify-center z-50"
    (click)="cerrarModal()"
  >
    <div
      class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md"
      (click)="$event.stopPropagation()"
    >
      <h2 class="text-xl font-semibold text-gray-800 mb-4">
        {{ editando() ? 'Editar categoría' : 'Nueva categoría' }}
      </h2>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
          <input
            type="text"
            [value]="nombre()"
            (input)="nombre.set($any($event.target).value)"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
          <select
            [value]="tipo()"
            (change)="tipo.set($any($event.target).value)"
            class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none"
          >
            <option value="INGRESO">INGRESO</option>
            <option value="GASTO">GASTO</option>
          </select>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button
            (click)="cerrarModal()"
            class="px-4 py-2 text-gray-600 hover:text-gray-800 transition"
          >
            Cancelar
          </button>
          <button
            (click)="guardar()"
            [disabled]="loading()"
            class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 disabled:opacity-50 transition"
          >
            {{ loading() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
