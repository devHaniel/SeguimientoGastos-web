<div class="max-w-lg mx-auto space-y-6">
  <h1 class="text-2xl font-bold text-gray-800">Configuración</h1>

  @if (loading()) {
    <p class="text-gray-400 text-center py-12">Cargando...</p>
  } @else {
    @if (error()) {
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">
        {{ error() }}
      </div>
    }

    @if (exito()) {
      <div class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-sm">
        Cambios guardados correctamente.
      </div>
    }

    <div class="bg-white rounded-xl shadow-sm p-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Nombre</label>
        <input
          type="text"
          [value]="nombre()"
          (input)="nombre.set($any($event.target).value)"
          class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <p class="text-gray-500 px-4 py-3 bg-gray-50 rounded-xl border border-gray-200">{{ email() }}</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Moneda</label>
        <input
          type="text"
          placeholder="$"
          maxlength="5"
          [value]="moneda()"
          (input)="moneda.set($any($event.target).value)"
          class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition"
        />
        <p class="text-xs text-gray-400 mt-1">Símbolo monetario (ej: $, €, £)</p>
      </div>

      <button
        (click)="guardar()"
        [disabled]="loading()"
        class="w-full bg-teal-600 text-white py-3 rounded-xl font-semibold hover:bg-teal-700 disabled:opacity-50 disabled:cursor-not-allowed transition"
      >
        {{ loading() ? 'Guardando...' : 'Guardar cambios' }}
      </button>
    </div>
  }
</div>
