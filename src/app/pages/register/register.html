<div class="min-h-screen bg-gradient-to-br from-teal-900 via-teal-800 to-teal-950 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <div class="text-center mb-8">
      <a routerLink="/" class="text-2xl font-bold text-teal-600">GastosApp</a>
      <p class="text-gray-500 mt-2">Crea tu cuenta gratuita</p>
    </div>

    @if (error()) {
      <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-6 text-sm">
        {{ error() }}
      </div>
    }

    <div class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Nombre</label>
        <input
          type="text"
          placeholder="Tu nombre"
          [value]="nombre()"
          (input)="nombre.set($any($event.target).value)"
          class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input
          type="email"
          placeholder="tu@email.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Contraseña</label>
        <input
          type="password"
          placeholder="••••••••"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:border-teal-500 focus:ring-2 focus:ring-teal-200 outline-none transition"
        />
      </div>

      <button
        (click)="registrar()"
        [disabled]="loading()"
        class="w-full bg-teal-600 text-white py-3 rounded-xl font-semibold hover:bg-teal-700 disabled:opacity-50 disabled:cursor-not-allowed transition"
      >
        {{ loading() ? 'Registrando...' : 'Crear cuenta' }}
      </button>
    </div>

    <p class="text-center text-sm text-gray-500 mt-8">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-teal-600 font-semibold hover:underline">Inicia sesión</a>
    </p>
  </div>
</div>
